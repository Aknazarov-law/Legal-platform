<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LexAI вЂ” Hujjat Generatori</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --gold:#C9A84C; --gold-light:#E8C97A; --dark:#0D0D0D; --dark2:#141414; --dark3:#1C1C1C; --text:#F0EDE6; --text-muted:#8A8680; --border:rgba(201,168,76,0.2); --border-focus:rgba(201,168,76,0.6); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--dark); color:var(--text); font-family:'DM Sans',sans-serif; font-weight:300; min-height:100vh; }
  nav { display:flex; align-items:center; justify-content:space-between; padding:20px 60px; border-bottom:1px solid var(--border); background:var(--dark2); }
  .logo { font-family:'Playfair Display',serif; font-size:20px; font-weight:700; color:var(--gold); letter-spacing:2px; text-decoration:none; }
  .logo span { color:var(--text); }
  .nav-back { color:var(--text-muted); font-size:13px; text-decoration:none; transition:color 0.3s; }
  .nav-back:hover { color:var(--gold); }
  .container { max-width:1100px; margin:0 auto; padding:60px 40px; display:grid; grid-template-columns:1fr 1fr; gap:60px; }
  .form-panel h1 { font-family:'Playfair Display',serif; font-size:32px; font-weight:700; margin-bottom:8px; }
  .form-panel h1 em { font-style:italic; color:var(--gold); }
  .form-subtitle { color:var(--text-muted); font-size:14px; margin-bottom:32px; line-height:1.6; }
  .api-warning { background:rgba(201,168,76,0.08); border:1px solid var(--border); padding:16px 20px; margin-bottom:20px; font-size:13px; color:var(--text-muted); line-height:1.6; }
  .api-warning strong { color:var(--gold); }
  .api-warning a { color:var(--gold); }
  .doc-types { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:24px; }
  .doc-type { border:1px solid var(--border); background:var(--dark3); padding:14px 16px; cursor:pointer; transition:all 0.3s; display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text-muted); font-family:'DM Sans',sans-serif; }
  .doc-type:hover { border-color:var(--border-focus); color:var(--text); }
  .doc-type.active { border-color:var(--gold); background:rgba(201,168,76,0.08); color:var(--gold); }
  .form-group { margin-bottom:16px; }
  .form-group label { display:block; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-muted); margin-bottom:8px; }
  .form-group input, .form-group textarea { width:100%; background:var(--dark3); border:1px solid var(--border); color:var(--text); padding:12px 16px; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:300; outline:none; transition:border-color 0.3s; }
  .form-group input:focus, .form-group textarea:focus { border-color:var(--border-focus); }
  .form-group textarea { resize:vertical; min-height:80px; line-height:1.6; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .btn-generate { width:100%; background:var(--gold); color:var(--dark); border:none; padding:18px; font-family:'DM Sans',sans-serif; font-size:15px; font-weight:500; letter-spacing:1px; text-transform:uppercase; cursor:pointer; transition:all 0.3s; }
  .btn-generate:hover:not(:disabled) { background:var(--gold-light); transform:translateY(-1px); }
  .btn-generate:disabled { opacity:0.6; cursor:not-allowed; }
  .result-panel { position:sticky; top:40px; height:fit-content; }
  .result-box { border:1px solid var(--border); background:var(--dark2); min-height:500px; display:flex; flex-direction:column; }
  .result-header { padding:16px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .result-title { font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--gold); }
  .result-actions { display:flex; gap:8px; }
  .btn-action { background:transparent; border:1px solid var(--border); color:var(--text-muted); padding:6px 14px; font-size:12px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; transition:all 0.3s; font-family:'DM Sans',sans-serif; }
  .btn-action:hover:not(:disabled) { border-color:var(--gold); color:var(--gold); }
  .btn-action:disabled { opacity:0.4; cursor:not-allowed; }
  .result-content { flex:1; padding:32px; font-size:14px; line-height:1.9; color:var(--text-muted); overflow-y:auto; max-height:600px; white-space:pre-wrap; word-wrap:break-word; }
  .result-placeholder { display:flex; flex-direction:column; align-items:center; justify-content:center; height:400px; gap:16px; text-align:center; }
  .result-placeholder-icon { font-size:48px; opacity:0.3; }
  .result-placeholder p { color:var(--text-muted); font-size:14px; max-width:240px; line-height:1.6; }
  .loading { display:flex; flex-direction:column; align-items:center; justify-content:center; height:400px; gap:20px; }
  .loading-dots { display:flex; gap:8px; }
  .loading-dots span { width:10px; height:10px; background:var(--gold); border-radius:50%; animation:loadblink 1.2s infinite; }
  .loading-dots span:nth-child(2) { animation-delay:0.2s; }
  .loading-dots span:nth-child(3) { animation-delay:0.4s; }
  @keyframes loadblink { 0%,80%,100%{opacity:0.2;transform:scale(0.8);}40%{opacity:1;transform:scale(1);} }
  .result-text { color:var(--text); }
  @media(max-width:768px){ nav{padding:16px 24px;} .container{grid-template-columns:1fr;padding:32px 20px;gap:40px;} .result-panel{position:static;} .form-row{grid-template-columns:1fr;} }
</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">LEX<span>AI</span></a>
  <a href="index.html" class="nav-back">в†ђ Bosh sahifa</a>
</nav>
<div class="container">
  <div class="form-panel">
    <h1>Hujjat <em>generatori</em></h1>
    <p class="form-subtitle">Hujjat turini tanlang, ma'lumotlarni kiriting вЂ” AI professional shartnoma tayyorlaydi.</p>
    <div class="api-warning">
      <strong>API kalit:</strong> <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a> dan olingan kalitni kiriting.
    </div>
    <div class="form-group">
      <label>Anthropic API kalit</label>
      <input type="password" id="api-key" placeholder="sk-ant-..." />
    </div>
    <div class="form-group">
      <label>Hujjat turi</label>
      <div class="doc-types">
        <button class="doc-type active" data-type="ijara">рџЏ  Ijara shartnomasi</button>
        <button class="doc-type" data-type="xizmat">рџ¤ќ Xizmat shartnomasi</button>
        <button class="doc-type" data-type="sotish">рџ’ј Sotib olish-sotish</button>
        <button class="doc-type" data-type="ish">рџ‘” Mehnat shartnomasi</button>
        <button class="doc-type" data-type="qarz">рџ’° Qarz shartnomasi</button>
        <button class="doc-type" data-type="ariza">рџ“ќ Ariza / Da'vonom</button>
      </div>
    </div>
    <div id="dynamic-fields"></div>
    <div class="form-row">
      <div class="form-group"><label>Tuzilgan sana</label><input type="date" id="sana" /></div>
      <div class="form-group"><label>Shahar</label><input type="text" id="shahar" placeholder="Toshkent" /></div>
    </div>
    <div class="form-group">
      <label>Qo'shimcha shartlar (ixtiyoriy)</label>
      <textarea id="qoshimcha" placeholder="Maxsus shartlar yoki eslatmalar..."></textarea>
    </div>
    <button class="btn-generate" id="generate-btn" onclick="generateDoc()">
      <span id="btn-text">вљЎ Hujjat Tayyorlash</span>
    </button>
  </div>
  <div class="result-panel">
    <div class="result-box">
      <div class="result-header">
        <span class="result-title">Natija</span>
        <div class="result-actions">
          <button class="btn-action" id="copy-btn" onclick="copyText()" disabled>Nusxa</button>
          <button class="btn-action" id="download-btn" onclick="downloadDoc()" disabled>Yuklab olish</button>
        </div>
      </div>
      <div class="result-content" id="result-content">
        <div class="result-placeholder">
          <div class="result-placeholder-icon">рџ“„</div>
          <p>Hujjat turi va ma'lumotlarni kiriting, so'ng tugmasini bosing</p>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
let currentType='ijara', generatedText='';
const fields={
  ijara:[
    {id:'ijarachi',label:"Ijarachi (F.I.O yoki tashkilot)",placeholder:'Abdullayev Sardor Aliyevich'},
    {id:'ijaraberuvchi',label:"Ijara beruvchi",placeholder:'Rahimov Bobur Sobirovich'},
    {id:'manzil',label:"Ijara ob'ekti manzili",placeholder:"Toshkent sh., Chilonzor tumani, 5-uy"},
    {id:'muddat',label:"Ijara muddati",placeholder:'12 oy'},
    {id:'narx',label:"Oylik ijara narxi",placeholder:'500 AQSh dollari'},
  ],
  xizmat:[
    {id:'buyurtmachi',label:"Buyurtmachi",placeholder:'Tashkilot yoki shaxs nomi'},
    {id:'ijrochi',label:"Ijrochi",placeholder:'Tashkilot yoki shaxs nomi'},
    {id:'xizmat_turi',label:"Xizmat turi",placeholder:'Masalan: veb-sayt yaratish'},
    {id:'muddat',label:"Xizmat muddati",placeholder:'3 oy'},
    {id:'narx',label:"Xizmat narxi",placeholder:"5,000,000 so'm"},
  ],
  sotish:[
    {id:'sotuvchi',label:"Sotuvchi",placeholder:'F.I.O yoki tashkilot'},
    {id:'xaridor',label:"Xaridor",placeholder:'F.I.O yoki tashkilot'},
    {id:'tovar',label:"Tovar / Mulk tavsifi",placeholder:"3 xonali kvartira, 85 m2"},
    {id:'narx',label:"Narxi",placeholder:'150,000 AQSh dollari'},
    {id:'tolov',label:"To'lov tartibi",placeholder:"Naqd / bank o'tkazmasi"},
  ],
  ish:[
    {id:'ish_beruvchi',label:"Ish beruvchi (tashkilot)",placeholder:'MChJ "Kompaniya nomi"'},
    {id:'xodim',label:"Xodim (F.I.O)",placeholder:'Karimov Jasur Bekovich'},
    {id:'lavozim',label:"Lavozim",placeholder:'Bosh yurist'},
    {id:'ish_haqi',label:"Ish haqi (oylik)",placeholder:"5,000,000 so'm"},
    {id:'muddat',label:"Shartnoma muddati",placeholder:'Muddatsiz / 1 yil'},
  ],
  qarz:[
    {id:'qarz_beruvchi',label:"Qarz beruvchi",placeholder:'F.I.O yoki tashkilot'},
    {id:'qarz_oluvchi',label:"Qarz oluvchi",placeholder:'F.I.O yoki tashkilot'},
    {id:'miqdor',label:"Qarz miqdori",placeholder:"10,000,000 so'm"},
    {id:'muddat',label:"Qaytarish muddati",placeholder:'6 oy'},
    {id:'foiz',label:"Foiz stavkasi (ixtiyoriy)",placeholder:'Foizsiz / yillik 12%'},
  ],
  ariza:[
    {id:'kimga',label:"Kimga (muassasa)",placeholder:'Toshkent shahar hokimligiga'},
    {id:'kimdan',label:"Kimdan (ariza beruvchi)",placeholder:'F.I.O, manzil, telefon'},
    {id:'mavzu',label:"Ariza mavzusi",placeholder:"Yer uchastkasi ajratish to'g'risida"},
    {id:'mazmun',label:"Muammo / talab mazmuni",placeholder:'Qisqacha holat va talabingiz...'},
  ],
};
const typeLabels={ijara:"Ijara shartnomasi",xizmat:"Xizmat ko'rsatish shartnomasi",sotish:"Sotib olish-sotish shartnomasi",ish:"Mehnat shartnomasi",qarz:"Qarz shartnomasi",ariza:"Ariza"};
document.getElementById('sana').valueAsDate=new Date();
document.getElementById('shahar').value='Toshkent';
function renderFields(type){
  const c=document.getElementById('dynamic-fields');
  c.innerHTML='';
  (fields[type]||[]).forEach(f=>{
    c.innerHTML+=`<div class="form-group"><label>${f.label}</label><input type="text" id="${f.id}" placeholder="${f.placeholder}" /></div>`;
  });
}
document.querySelectorAll('.doc-type').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.doc-type').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentType=btn.dataset.type;
    renderFields(currentType);
  });
});
renderFields('ijara');
function buildPrompt(){
  const sana=document.getElementById('sana').value;
  const shahar=document.getElementById('shahar').value;
  const qoshimcha=document.getElementById('qoshimcha').value;
  const typeLabel=typeLabels[currentType];
  let fieldData='';
  (fields[currentType]||[]).forEach(f=>{
    const el=document.getElementById(f.id);
    if(el&&el.value.trim()) fieldData+=`- ${f.label}: ${el.value.trim()}\n`;
  });
  return `Sen O'zbekiston qonunchiligiga ko'ra professional yuridik hujjatlar tayyorlaydigan ekspert yuristsan.\n\nQuyidagi ma'lumotlar asosida O'ZBEK TILIDA professional ${typeLabel} tayyorla:\n\nMA'LUMOTLAR:\n- Hujjat turi: ${typeLabel}\n- Tuzilgan sana: ${sana}\n- Shahar: ${shahar}\n${fieldData}${qoshimcha?`- Qo'shimcha shartlar: ${qoshimcha}`:''}\n\nTALABLAR:\n1. O'zbekiston Respublikasi Fuqarolik kodeksiga to'liq mos bo'lsin\n2. Barcha standart yuridik bandlar bo'lsin\n3. Professional yuridik uslubda yoz\n4. Imzo satrlari va sanalar uchun joy qoldur\n5. Hujjat to'liq va tayyor ko'rinishda bo'lsin\n\nFaqat hujjat matnini ber, izoh yoki tushuntirish qo'shma.`;
}
async function generateDoc(){
  const apiKey=document.getElementById('api-key').value.trim();
  if(!apiKey){alert('Iltimos, API kalitni kiriting!');return;}
  const btn=document.getElementById('generate-btn');
  const btnText=document.getElementById('btn-text');
  const rc=document.getElementById('result-content');
  btn.disabled=true; btnText.textContent='Tayyorlanmoqda...';
  document.getElementById('copy-btn').disabled=true;
  document.getElementById('download-btn').disabled=true;
  generatedText='';
  rc.innerHTML=`<div class="loading"><div class="loading-dots"><span></span><span></span><span></span></div><p>AI hujjat tayyorlamoqda...</p></div>`;
  try{
    const response=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-calls':'true'
      },
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:4000,
        stream:true,
        messages:[{role:'user',content:buildPrompt()}]
      })
    });
    if(!response.ok){
      const err=await response.json();
      throw new Error(err.error?.message||`Xato: ${response.status}`);
    }
    rc.innerHTML='<div class="result-text" id="streaming-text"></div>';
    const streamEl=document.getElementById('streaming-text');
    const reader=response.body.getReader();
    const decoder=new TextDecoder();
    while(true){
      const{done,value}=await reader.read();
      if(done)break;
      const chunk=decoder.decode(value);
      for(const line of chunk.split('\n')){
        if(line.startsWith('data: ')){
          const data=line.slice(6);
          if(data==='[DONE]')continue;
          try{
            const parsed=JSON.parse(data);
            if(parsed.type==='content_block_delta'&&parsed.delta?.text){
              generatedText+=parsed.delta.text;
              streamEl.textContent=generatedText;
              rc.scrollTop=rc.scrollHeight;
            }
          }catch(e){}
        }
      }
    }
    document.getElementById('copy-btn').disabled=false;
    document.getElementById('download-btn').disabled=false;
  }catch(err){
    rc.innerHTML=`<div style="color:#E24B4A;padding:20px"><strong>Xato:</strong><br>${err.message}</div>`;
  }
  btn.disabled=false;
  btnText.textContent='вљЎ Hujjat Tayyorlash';
}
function copyText(){
  navigator.clipboard.writeText(generatedText).then(()=>{
    const btn=document.getElementById('copy-btn');
    btn.textContent='вњ“ Nusxalandi';
    setTimeout(()=>btn.textContent='Nusxa',2000);
  });
}
function downloadDoc(){
  const blob=new Blob([generatedText],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`${typeLabels[currentType]} - LexAI.txt`; a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
